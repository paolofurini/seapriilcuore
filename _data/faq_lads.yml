- domanda: "Di cosa parla L'Accordatore del Silenzio?"
  risposta: "È la storia di Sante, un accordatore di pianoforti che nel 2042 vive in un casale di pietra sull'Appennino, lontano dalla Matrix. A Ginevra, Elsa Morrow, a capo di un'azienda di interfacce neurali, possiede uno Steinway del 1910 che ogni notte suona da solo una nota che nessun ingegnere sa spiegare. Le loro strade si incontrano attorno a quel pianoforte."
- domanda: "Che genere di romanzo è?"
  risposta: "Un romanzo spirituale con la tensione di un giallo: narrativa visionaria e metafisica, ambientata in un futuro vicino. Racconta il discernimento, cioè la capacità di distinguere ciò che ci nutre da ciò che ci fa male, in un mondo dove la tecnologia sa tutto di noi."
- domanda: "Quando esce e dove si potrà comprare?"
  risposta: "È in uscita, in cartaceo ed ebook. Dopo l'approvazione della copia di prova sarà disponibile in libreria e negli store online. La data verrà annunciata su questo sito e nella newsletter Se Apri il Cuore."
- domanda: "Bisogna conoscere la spiritualità o l'esoterismo per leggerlo?"
  risposta: "No. Le idee che attraversano il libro vengono da una tradizione antica, ma la storia si regge da sola. Chi conosce quella tradizione sa dove guardare; a chi non la conosce basta la storia."
- domanda: "Dove è ambientato?"
  risposta: "Tra Ginevra e l'Appennino centrale, in luoghi veri come Leonessa, Cantalice, Castelluccio e Rieti. Castel di Luce, il paese di Sante, è immaginario."
- domanda: "Fa parte di una serie?"
  risposta: "Sì, è il primo dei Romanzi dell'Invisibile. Ogni romanzo si legge da solo; il secondo, La Voce Rubata, è in scrittura."
- domanda: "Chi è l'autore?"
  risposta: "Paolo Furini, per più di trent'anni manager in multinazionali della tecnologia tra marketing, comunicazione e dati. Oggi si dedica alla ricerca interiore, al Servizio e alla scrittura."
