<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a2a4a">
  <link rel="preload" href="{{ '/assets/fonts/newsreader.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  {% seo %}
  {% include schema-person.html %}{% if page.schema %}{% include {{ page.schema }} %}{% endif %}
  {% feed_meta %}
</head>
<body class="{{ page.body_class | default: 'paper' }}">
  <a class="skip" href="#contenuto">Vai al contenuto</a>
  {% include header.html %}
  <main id="contenuto">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
