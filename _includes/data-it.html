{%- assign mesi = "gennaio,febbraio,marzo,aprile,maggio,giugno,luglio,agosto,settembre,ottobre,novembre,dicembre" | split: "," -%}
{%- assign m = include.date | date: "%-m" | minus: 1 -%}
<time datetime="{{ include.date | date_to_xmlschema }}">{{ include.date | date: "%-d" }} {{ mesi[m] }} {{ include.date | date: "%Y" }}</time>
