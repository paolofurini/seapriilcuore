      "@type": "FAQPage",
      "mainEntity": [
        {% for q in site.data.faq_lads %}{ "@type": "Question", "name": {{ q.domanda | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ q.risposta | strip_html | jsonify }} } }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
