<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "DefinedTerm",
      "@id": "{{ site.url }}/digital-feng-shui/#termine",
      "name": "Digital Feng Shui",
      "inLanguage": "it",
      "description": "L'arte di armonizzare smartphone e computer perché siano strumenti al nostro servizio e non padroni della nostra attenzione. Applica il principio del Feng Shui agli spazi digitali: chiudere le porte (notifiche), lasciare spazio vuoto (schermata Home), respirare prima del click.",
      "url": "{{ site.url }}/digital-feng-shui/"
    },
    {
      "@type": "Article",
      "headline": "Digital Feng Shui: cos'è e come si pratica",
      "url": "{{ site.url }}/digital-feng-shui/",
      "inLanguage": "it",
      "author": { "@id": "{{ site.url }}/#paolo" },
      "about": { "@id": "{{ site.url }}/digital-feng-shui/#termine" },
      "image": "{{ site.url }}/assets/img/blog/digital-feng-shui-guida-cover-1600.jpg"
    },
    {
      "@type": "HowTo",
      "name": "Le 3 Regole d'Oro del Digital Feng Shui",
      "inLanguage": "it",
      "step": [
        { "@type": "HowToStep", "name": "Chiudere le porte", "text": "Disattiva tutte le notifiche non umane e lascia attive solo chiamate e messaggi di persone vere." },
        { "@type": "HowToStep", "name": "Lasciare spazio vuoto", "text": "Sulla prima schermata tieni solo gli strumenti essenziali; social e posta si raggiungono scorrendo o cercando l'app." },
        { "@type": "HowToStep", "name": "Respirare prima del click", "text": "Prima di aprire posta o social fermati tre secondi, entra con un'intenzione chiara ed esci appena hai finito." }
      ]
    },
    {
      "@type": "FAQPage",
      "mainEntity": [
        {% for q in site.data.faq_dfs %}{ "@type": "Question", "name": {{ q.domanda | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ q.risposta | jsonify }} } }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }
  ]
}
</script>
